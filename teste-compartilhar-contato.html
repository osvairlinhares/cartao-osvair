<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste compartilhar contato</title><style>body{font-family:Arial;background:#07110f;color:white;padding:30px}main{max-width:420px;margin:auto;background:#10251f;padding:24px;border-radius:20px}button,a{display:block;width:100%;box-sizing:border-box;padding:16px;margin-top:14px;border:0;border-radius:12px;font-weight:bold;text-align:center;text-decoration:none}button{background:#f0a500;color:#111}a{background:#1d4b3e;color:white}#s{margin-top:18px;line-height:1.4}</style></head><body><main><h2>Teste Android</h2><p>Osvair Linhares<br>Gerente Comercial<br>Centro Oeste Distribuidora de Peças<br>+55 62 99159-0026</p><button id="b">COMPARTILHAR CONTATO</button><a href="osvair-linhares.vcf">VCF NORMAL</a><div id="s"></div></main><script>const b=document.querySelector('#b'),s=document.querySelector('#s');b.onclick=async()=>{s.textContent='';try{const r=await fetch('osvair-linhares.vcf',{cache:'no-store'});if(!r.ok)throw 0;const x=await r.blob();const f=new File([x],'osvair-linhares.vcf',{type:'text/vcard'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Osvair Linhares',text:'Contato de Osvair Linhares'});}else{s.textContent='Este navegador não permite compartilhar o VCF diretamente.'}}catch(e){if(e?.name!=='AbortError')s.textContent='Não foi possível compartilhar diretamente neste navegador.'}}</script></body></html>
